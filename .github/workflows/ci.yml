name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/bunyip_box_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/bunyip_box_ci
      RUNTIME_DATABASE_USER: bunyip_box_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Milestone 1 was bootstrapped in a restricted environment. Replace this
      # with `npm ci` as soon as the first networked install commits package-lock.json.
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:authorization
      - run: npm run build
